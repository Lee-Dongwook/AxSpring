spring:
  application:
    name: axspring

  # 로컬 실행 시 프로젝트 루트의 .env를 읽는다. 운영 환경에서는 배포 환경변수가 우선한다.
  config:
    import: optional:file:.env[.properties]

  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:axspring}
    username: ${DB_USERNAME:axspring}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration
    clean-disabled: true

app:
  jwt:
    issuer: axspring-auth
    audience: axspring-api
    key-id: local-key-1
    private-key-path: ${JWT_PRIVATE_KEY_PATH}
    public-key-path: ${JWT_PUBLIC_KEY_PATH}
    access-token-ttl: 15m
    refresh-token-ttl: 14d

  cors:
    allowed-origins:
      - http://localhost:3000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
