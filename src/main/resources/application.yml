spring:
  application:
    name: axspring

  # 로컬 실행 시 프로젝트 루트의 .env를 읽는다. 운영 환경에서는 배포 환경변수가 우선한다.
  config:
    import: optional:file:.env[.properties]

  profiles:
    default: local

  flyway:
    locations: classpath:db/migration
    clean-disabled: true

app:
  cors:
    allowed-origins:
      - http://localhost:3000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
